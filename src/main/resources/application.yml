spring:
  application:
    name: live-staffing-dashboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/live_staffing}
    username: ${DB_USER:oloodi}
    password: ${DB_PASSWORD:oloodi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
    include-message: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: WARN
